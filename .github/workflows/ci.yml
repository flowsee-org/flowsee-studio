name: Studio CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: studio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Check lint
        run: npm run lint
      - name: Build production frontend
        env:
          VITE_BASE44_APP_ID: flowsee-ci
          VITE_BASE44_APP_BASE_URL: https://studio.flowsee.ir
          VITE_MAIN_API_URL: https://flowsee.ir
        run: npm run build
